<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DIWALI OFFERS{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="demo-strip">   REAL MONEY • REAL PAYMENTS</div>
<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') if current_user else url_for('login') }}"><span class="brand-icon">✦</span> DIWALI <b>OFFERS</b></a>
  {% if current_user %}
  <nav><a href="{{ url_for('dashboard') }}">Home</a><a href="{{ url_for('wallet') }}">Wallet</a><a href="{{ url_for('referral') }}">Refer</a><a href="{{ url_for('logout') }}" class="nav-logout">Logout</a></nav>
  {% endif %}
</header>
<main class="page">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer></footer>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body></html>
